# Fly.io app for Bo's API. Deployed by .github/workflows/api.yml on merges to
# main, or by hand with `fly deploy` from the repository root (the image needs
# both api/ and areas/).
app = "bo-api-bohac"   # Fly app names are global; see docs/SETUP.md step 2
primary_region = "ord"   # Chicago. Change to the region nearest you before the first deploy.

[build]
  dockerfile = "api/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine stays on: later phases hold long-lived connections
  # (Home Assistant), which scale-to-zero would drop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
